name: CI
on:
  push:
  pull_request:
    types: [ opened, reopened ]

jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            python-version: "3.10"
          - os: ubuntu-22.04
            python-version: "3.14"
          - os: windows-latest
            python-version: "3.10"
          - os: windows-latest
            python-version: "3.14"
          - os: macos-latest
            python-version: "3.10"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Install uv and set the Python version
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Lock dependencies
        shell: bash
        run: uv lock
      - name: Install dependencies
        shell: bash
        run: uv sync --locked --all-extras --dev
      - name: Install DBus (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: sudo apt install -y dbus-x11
      - name: Initialize GUI (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          open -a Finder || true
          sleep 2
      - name: Run tests with coverage
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "Linux" ]; then
            dbus-launch --exit-with-session uv run pytest -v --cov=aionowplaying --cov-report=term-missing --cov-report=xml:coverage.xml
          else
            uv run pytest -v --cov=aionowplaying --cov-report=term-missing --cov-report=xml:coverage.xml
          fi
      - name: Code Coverage Summary (Linux only)
        if: runner.os == 'Linux'
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: coverage.xml
          format: markdown
          output: console
