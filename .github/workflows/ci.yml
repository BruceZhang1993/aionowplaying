name: CI
on:
  push:
  pull_request:
    types: [ opened, reopened ]

jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            python-version: "3.10"
          - os: ubuntu-22.04
            python-version: "3.14"
          - os: windows-latest
            python-version: "3.10"
          - os: windows-latest
            python-version: "3.14"
          - os: macos-latest
            python-version: "3.10"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Install uv and set the Python version
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Lock dependencies
        shell: bash
        run: uv lock
      - name: Install dependencies
        shell: bash
        run: uv sync --locked --all-extras --dev
      - name: Install DBus (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: sudo apt install -y dbus-x11
      - name: Initialize GUI (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          open -a Finder || true
          sleep 2
      - name: Run tests with coverage
        shell: bash
        run: |
          set +e
          if [ "$RUNNER_OS" == "Linux" ]; then
            dbus-launch --exit-with-session uv run pytest -v --cov --cov-branch --cov-report=xml --junitxml=junit.xml -o junit_family=legacy
          else
            uv run pytest -v --cov --cov-branch --cov-report=xml --junitxml=junit.xml -o junit_family=legacy
          fi
          test_exit_code=$?
          if [ "$RUNNER_OS" == "macOS" ] && [ "$test_exit_code" -eq 137 ]; then
            echo "Tests exited with code 137 on macOS; allowing failure."
            exit 0
          fi
          exit "$test_exit_code"
      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
